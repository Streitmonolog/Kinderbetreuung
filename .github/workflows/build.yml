name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release executable
        shell: powershell
        run: .\Build\Build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinderbetreuung-Windows
          path: |
            Release/*.exe
            Release/*.sha256
